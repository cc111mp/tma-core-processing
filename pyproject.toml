[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phomedics-tma-qc"
version = "0.4.1"
readme = "README.md"
description = "Traceable TMA preprocessing and stage-specific quality review"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "tifffile>=2024.1", "Pillow>=10", "opencv-python>=4.8"]

[project.optional-dependencies]
codecs = ["imagecodecs>=2024.1"]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff==0.13.2"]
registration-roma = ["romatch==0.1.2"]
registration-refine = ["SimpleITK>=2.3,<3"]

[project.scripts]
tma-qc = "tma_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
